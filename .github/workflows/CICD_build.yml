
name: CI Build AM32

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ESC target to compile'
        required: true
        default: 'SEQURE_4IN1_F421'
        type: choice
        options:
          - SEQURE_4IN1_F421
          - ALL

      file_type:
        description: 'File type to upload'
        required: true
        default: 'hex'
        type: choice
        options:
          - hex
          - elf

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: make arm_sdk_install

      - name: Build firmware
        run: |
          if [ "${{ inputs.target }}" = "ALL" ]; then
            make -j8
          else
            make -j8 ${{ inputs.target }}
          fi

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: AM32-${{ inputs.target }}-${{ inputs.file_type }}
          path: obj/*.${{ inputs.file_type }}
          retention-days: 60
          if-no-files-found: error
